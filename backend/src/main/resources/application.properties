
spring.application.name=fresherradar
server.port=${PORT:8080}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fresherradar}
spring.datasource.username=${DB_USERNAME:fresherradar}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---- CORS ----
fresherradar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# ---- Admin endpoints (POST /api/admin/**). Leave empty to disable them. ----
fresherradar.admin.token=${ADMIN_TOKEN:}

# ---- Scheduler: daily refresh (Spring cron: sec min hour day month weekday) ----
fresherradar.scheduler.enabled=${SCHEDULER_ENABLED:true}
fresherradar.scheduler.cron=${REFRESH_CRON:0 0 2 * * *}
fresherradar.scheduler.zone=${REFRESH_ZONE:Asia/Kolkata}

# ---- Collection ----
fresherradar.collection.max-job-age-days=${MAX_JOB_AGE_DAYS:45}
fresherradar.collection.http-timeout-seconds=20

# ---- Greenhouse Job Board ----
fresherradar.sources.greenhouse.enabled=${GREENHOUSE_ENABLED:false}
fresherradar.sources.greenhouse.boards=${GREENHOUSE_BOARDS:instawork,karya,groww,formaaiinc3,zinnov,inmobi,druva,devrev,netradyne,observeai,airbnb,rubrik,discord,coinbase,bloomreach,elastic,stripe,fivetran,gitlab,worldquant,twilio}

# ---- Adzuna public API ----
fresherradar.sources.adzuna.enabled=${ADZUNA_ENABLED:false}
fresherradar.sources.adzuna.app-id=${ADZUNA_APP_ID:}
fresherradar.sources.adzuna.app-key=${ADZUNA_APP_KEY:}
fresherradar.sources.adzuna.country=in
fresherradar.sources.adzuna.queries=${ADZUNA_QUERIES:fresher,entry level,graduate trainee,intern,internship,junior developer,campus hiring}
fresherradar.sources.adzuna.pages-per-query=${ADZUNA_PAGES:4}
fresherradar.sources.adzuna.results-per-page=50

# ---- RSS / Atom feeds ----
fresherradar.sources.rss.enabled=${RSS_ENABLED:false}
fresherradar.sources.rss.feeds=${RSS_FEEDS:}

# ---- LLM classification (Gemini / Groq) ----
fresherradar.llm.provider=${LLM_PROVIDER:gemini}

# Gemini
fresherradar.llm.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
fresherradar.llm.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
fresherradar.llm.api-key=${LLM_API_KEY:}

# Groq
fresherradar.llm.groq-base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
fresherradar.llm.groq-model=${GROQ_MODEL:openai/gpt-oss-120b}
fresherradar.llm.groq-api-key=${GROQ_API_KEY:}

fresherradar.llm.max-output-tokens=700
fresherradar.llm.batch-limit-per-run=${LLM_BATCH_LIMIT:1000}

# USD per 1,000,000 tokens
fresherradar.llm.input-price-per-million=${LLM_INPUT_PRICE_PER_M:0}
fresherradar.llm.output-price-per-million=${LLM_OUTPUT_PRICE_PER_M:0}
# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Classification confidence ----
fresherradar.llm.min-confidence=${LLM_MIN_CONFIDENCE:0.5}

# ---- Evaluation ----
fresherradar.evaluation.file=${EVAL_FILE:../docs/eval/labelled-jobs.csv}
